<header class="header">
  <a routerLink="/" class="brand">Fundamentos Angular</a>
  @if (auth.isAuthenticated()) {
    <a routerLink="/usuarios">Ir para o app</a>
  } @else {
    <p-button label="Entrar" size="small" (onClick)="auth.login('/usuarios')" />
  }
</header>
<main class="main">
  <router-outlet />
</main>
