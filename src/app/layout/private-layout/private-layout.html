<header class="header">
  <a routerLink="/" class="brand">Fundamentos Angular</a>

  <nav aria-label="Principal">
    <a routerLink="/usuarios" routerLinkActive="active">Usuários</a>
    <a routerLink="/relatorios" routerLinkActive="active">Relatório</a>
  </nav>

  <div class="session">
    <span>{{ auth.user()?.name }}</span>
    <p-button label="Sair" size="small" severity="secondary" [outlined]="true" (onClick)="auth.logout()" />
  </div>
</header>
<main class="main">
  <router-outlet />
</main>
