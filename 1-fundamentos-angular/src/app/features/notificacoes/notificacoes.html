<app-fundamento
  titulo="Notificações"
  resumo="Toda mensagem ao usuário (ok, aviso, erro) passa pelo NotificationService, uma fachada sobre o toast do PrimeNG. As features não conhecem o PrimeNG: se o componente de toast mudar, só o service muda. Este é um padrão do projeto, não uma recomendação do Angular."
  [experimente]="experimente"
  [aprofundamento]="['ux-e-plataforma/notificacoes.md']"
>
  <app-notificacoes-painel
    [historico]="service.historico()"
    (disparar)="service.disparar($event.tipo, $event.mensagem)"
    (limpar)="service.limpar()"
  />
</app-fundamento>
