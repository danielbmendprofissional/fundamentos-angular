<app-fundamento
  titulo="Acessibilidade"
  resumo="O Angular recomenda reutilizar elementos nativos, gerenciar atributos ARIA por binding, mover o foco após a navegação (NavigationEnd) e usar o pacote a11y do CDK: LiveAnnouncer para anúncios e cdkTrapFocus para diálogos. Esta página executa as duas últimas e lista o que o Shell já faz."
  [experimente]="experimente"
  [fontes]="fontes"
  [aprofundamento]="['ux-e-plataforma/acessibilidade-e-seguranca.md']"
>
  <app-acessibilidade-painel
    [dialogoAberto]="service.dialogoAberto()"
    [historico]="service.historico()"
    (anunciar)="service.anunciar($event.mensagem, $event.urgente)"
    (abrirDialogo)="service.abrirDialogo()"
    (fecharDialogo)="service.fecharDialogo()"
  />
</app-fundamento>
