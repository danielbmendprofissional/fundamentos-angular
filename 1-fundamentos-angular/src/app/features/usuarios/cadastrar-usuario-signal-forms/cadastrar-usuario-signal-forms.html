<app-fundamento
  titulo="Signal Forms"
  resumo="Signal Forms guarda o estado do formulário num signal comum e declara as regras num schema, com a mensagem junto de cada regra. É o mesmo caso de uso do Reactive Forms, com o mesmo service; só o formulário dumb muda."
  [experimente]="experimente"
  [fontes]="fontes"
  [aprofundamento]="['formularios/formularios-reactive-vs-signal-forms.md']"
>
  <p class="acoes"><a routerLink="/usuarios/novo">Ver versão Reactive Forms</a></p>

  <section class="card" aria-label="Novo usuário">
    <app-usuario-form-signal
      [salvando]="service.salvando()"
      [erroServidor]="service.erro()"
      (enviado)="cadastrar($event)"
      (cancelado)="voltar()"
    />
  </section>
</app-fundamento>
