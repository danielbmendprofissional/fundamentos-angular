<app-fundamento
  i18n-titulo="@@i18n.pagina.titulo"
  titulo="Internacionalização (i18n)"
  i18n-resumo="@@i18n.pagina.resumo"
  resumo="O Angular traduz em tempo de build: você marca os textos (atributo i18n, i18n-atributo e $localize), extrai para um arquivo XLIFF, traduz e gera um build por idioma. Datas, moedas e números não precisam de marcação: os pipes seguem o LOCALE_ID."
  [experimente]="experimente"
  [fontes]="fontes"
  [aprofundamento]="['i18n.md']"
>
  <app-i18n-painel
    [locale]="locale"
    [nome]="service.nome()"
    [saudacao]="service.saudacao()"
    [quantidade]="service.quantidade()"
    [agora]="agora"
    (nomeAlterado)="service.definirNome($event)"
    (adicionar)="service.adicionar()"
    (zerar)="service.zerar()"
  />
</app-fundamento>
